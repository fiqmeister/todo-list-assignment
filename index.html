<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Priority List</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="styles.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.23.0/dist/sweetalert2.min.css" rel="stylesheet"
</head>

<body>
    <div class="container">
        <h1 class="text-center fw-bold mt-5 mb-5">To-Do List</h1>
        <h3></h3>
        <hr />
        <!-- Add Task Form -->
        <div class="addTaskForm">
            <div class="innerDivText">
                <label class="form-label">Task Name: </label>
                <input type="text" id="taskName" class="form-control" required />
                <span id="error-task-input"></span>
            </div>
            <div class="innerDivText">
                <label class="form-label">Due Date: </label>
                <input type="date" id="dueDate" class="form-control" required />
                <span id="error-date-input"></span>
            </div>
        </div>
        <div class="addTaskForm">
            <div class="innerDivRadio">
                <label class="form-label">Priority: </label>
                <input class="form-check-input" type="radio" name="priority" value="Low" checked /><label
                    class="optionRadio">Low</label>
                <input class="form-check-input" type="radio" name="priority" value="Medium" /><label
                    class="optionRadio">Medium</label>
                <input class="form-check-input" type="radio" name="priority" value="High" /><label
                    class="optionRadio">High</label>
                <!-- Challenge: To use dropdown list -->
            </div>
            <div class="innerDivRadio">
                <label class="form-label">Status: </label>
                <input class="form-check-input" type="radio" name="status" value="Pending" checked /><label
                    class="optionRadio">Pending</label>
                <input class="form-check-input" type="radio" name="status" value="Ongoing" /><label
                    class="optionRadio">Ongoing</label>
                <input class="form-check-input" type="radio" name="status" value="Completed" /><label
                    class="optionRadio">Completed</label>
                <!-- Challenge: To use dropdown list -->
            </div>
        </div>
        <div class="divBtn">
            <button id="addBtn" class="btn btn-primary ">Add Task</button>
        </div>
        <hr />
        <div id="moreFunction">
            <div id="searchFunction">
                <input type="text" id="searchTerms" class="form-control" placeholder="Search task name" />
                <button id="searchBtn" class="btn btn-primary ">Search</button>
                <button id="clearBtn" class="btn btn-secondary ">Clear</button>
            </div>
            <div class="divBtn">
                <button id="saveBtn" class="btn btn-success">Save List</button>
            </div>
        </div>
        <div class="border rounded-3 overflow-hidden mt-3">
            <table class="table table-fixed mb-0">
                <thead>
                    <tr>
                        <th width="5%">#</th>
                        <th width="40%">Task Name</th>
                        <th width="10%">Priority</th>
                        <th width="15%">Due Date</th>
                        <th width="15%">Status</th>
                        <th width="15%"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Todo items will be appended here: parent <tr> -->
                </tbody>
            </table>
        </div>
    </div>
    <!-- sweetalert2 script-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.23.0/dist/sweetalert2.all.min.js"></script>
    <!-- Scripts and axios-->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.19.0/dist/axios.min.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>

</body>

</html>
