<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Priority List</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1 class="text-center fw-bold mt-5 mb-5">To-Do List</h1>
        <div>
            
        </div>
        <hr/>
        <div class="border rounded-3 overflow-hidden">
        <table class="table mb-0">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Task Name</th>
                    <th>Priority</th>
                    <th>Due Date</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Todo items will be appended here: parent <tr> -->
                <tr>
                    <th>1</th>
                    <td>Pay all bills</td>
                    <td>High</td>
                    <td>16-08-2026</td>
                    <td>Completed</td>
                </tr>

            </tbody>
        </table>
        </div>
    </div>

    <!-- Including data.js and script.js -->
    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
